name: Release

# Si attiva creando un tag di versione:
#   git tag v0.3.0 && git push origin v0.3.0
# Il tag deve corrispondere alla versione in src-tauri/tauri.conf.json.
on:
  push:
    tags:
      - 'v*'
  # Utile per riprovare una release senza ricreare il tag
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag da pubblicare (es. v0.3.0)'
        required: true

jobs:
  release:
    # Solo Windows: è l'unica piattaforma per cui il progetto distribuisce
    # installer. Per aggiungere macOS/Linux basta estendere questa matrice.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    permissions:
      # Necessario a tauri-action per creare la release e caricare gli artifact
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma degli aggiornamenti: senza queste variabili tauri-action
          # non genera latest.json né i file .sig
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          releaseName: 'MyMedicalFlow __VERSION__'
          # Il corpo della release finisce nel campo `notes` di latest.json e
          # viene mostrato nella finestra di aggiornamento dentro l'app.
          releaseBody: |
            ## Novità di questa versione

            <!-- Sostituisci con le novità reali prima di pubblicare -->

            ---
            Aggiornamento automatico: se hai già MyMedicalFlow installato,
            l'app ti proporrà da sola questa versione al prossimo avvio.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
