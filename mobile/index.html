<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Colore della barra di stato in Safari: lo stesso della testata di vetro.
      Segue il tema scelto nell'app (non quello del telefono). Safari lo legge
      all'apertura della pagina, prima che l'app carichi il tema dall'archivio:
      per questo lo script qui sotto applica subito l'ultimo tema usato
      (ricordato da useTema in App.tsx).
    -->
    <meta name="theme-color" content="#eef4f4" />
    <!--
      Fondo della pagina subito, prima del CSS dell'app (niente lampo bianco), e
      velo per il cambio di tema: l'app si ricarica (vedi useTema in App.tsx) e
      il velo, nel colore del nuovo tema, copre ricaricamento e avvio finché la
      schermata è pronta. Stessi colori di --fondo-app in src/index.css.
    -->
    <style>
      html{background-color:#eef4f4}
      html.dark{background-color:#050a0b}
      #velo{position:fixed;inset:0;z-index:9000;background-color:#eef4f4;opacity:0;pointer-events:none;transition:opacity .28s ease}
      html.dark #velo{background-color:#050a0b}
      html.velo #velo{opacity:1;pointer-events:auto}
    </style>
    <!-- Prima del primo disegno: tema e velo (file a parte: la CSP vieta gli script in linea) -->
    <script src="/avvio.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Installata sulla Home, l'app sta SOTTO la barra di stato ("default"), che
      iOS colora con theme-color, come la testata. Con "black-translucent" iOS 26
      la posizionava dietro la barra di stato ma le dava l'altezza di un'app che
      ci sta sotto: misurati su iPhone 17 schermo 874, finestra 812, isola 62,
      e sotto i 812 pt una fascia vuota che la pagina non può raggiungere
      (sfondo dell'html colorato: la fascia non cambiava).
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyMedicalFlow" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Icona sulla Home di iPhone: quella del desktop (src-tauri/icons), su fondo
         pieno perché iOS riempie di nero le parti trasparenti -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Manifest: senza, iOS 26 apre l'app dalla Home come segnalibro vecchio stile
         (display-mode standalone falso) e le dà 62 pt di altezza in meno -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MyMedicalFlow</title>
  </head>
  <body>
    <!--
      Striscia fissa in cima, nel colore di fondo dell'app (stile in index.css).
      Safari (iOS 26) colora la zona di barra di stato e isola col fondo
      dell'elemento fisso sul bordo in alto (se fosse trasparente userebbe bianco
      o nero) e lo legge solo all'apertura: per questo al cambio di tema l'app
      si ricarica (useTema in App.tsx).
    -->
    <div id="tinta-barra" aria-hidden="true"></div>
    <div id="velo" aria-hidden="true"></div>
    <div id="root"></div>
    <!--
      Schermata d'emergenza: solo se l'app NON riesce a partire (un file che non
      arriva, una sintassi che il browser non capisce). Gli errori ad app avviata
      li mostra la pagina d'errore dell'app (componenti/ErroreApp.tsx).
      Script classico e senza sintassi moderna, così funziona sempre.
    -->
    <style>
      #emergenza{position:fixed;inset:0;z-index:9999;overflow:auto;background:#eef4f4;color:#111827;
        font:15px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
        padding:calc(40px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom))}
      #emergenza .scatola{max-width:28rem;margin:0 auto}
      #emergenza .marchio{display:flex;align-items:center;gap:10px;font-weight:600}
      #emergenza .marchio img{width:32px;height:32px}
      #emergenza .scheda{margin-top:32px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.8);
        border-radius:22px;padding:24px;box-shadow:0 10px 30px -18px rgba(13,70,70,.35)}
      #emergenza .simbolo{width:48px;height:48px;border-radius:16px;background:#fef3c7;color:#d97706;
        display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
      #emergenza h1{font-size:20px;line-height:1.3;margin:16px 0 0}
      #emergenza p{margin:8px 0 0;color:#4b5563}
      #emergenza button{width:100%;min-height:48px;border-radius:12px;font:inherit;font-weight:500;cursor:pointer}
      #emergenza .primario{margin-top:24px;border:0;background:#0d9488;color:#fff}
      #emergenza .secondario{margin-top:12px;border:1px solid rgba(15,118,110,.2);background:rgba(255,255,255,.7);color:#0f766e}
      #emergenza details{margin-top:16px}
      #emergenza summary{cursor:pointer;font-size:14px;font-weight:500;color:#374151;padding:8px 0}
      #emergenza pre{white-space:pre-wrap;word-break:break-word;background:rgba(17,24,39,.05);padding:12px;
        border-radius:12px;font-size:11px;line-height:1.5;max-height:16rem;overflow:auto;-webkit-user-select:text;user-select:text}
      @media (prefers-color-scheme:dark){
        #emergenza{background:#050a0b;color:#f9fafb}
        #emergenza .scheda{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08)}
        #emergenza .simbolo{background:rgba(120,53,15,.3)}
        #emergenza p,#emergenza summary{color:#d1d5db}
        #emergenza .secondario{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#5eead4}
        #emergenza pre{background:rgba(255,255,255,.06);color:#d1d5db}
      }
    </style>
    <script src="/emergenza.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
