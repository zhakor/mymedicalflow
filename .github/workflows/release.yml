name: Release

# Si attiva creando un tag di versione:
#   git tag v0.3.0 && git push origin v0.3.0
# Il tag deve corrispondere alla versione in src-tauri/tauri.conf.json.
on:
  push:
    tags:
      - 'v*'
  # Utile per riprovare una release senza ricreare il tag
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag da pubblicare (es. v0.3.0)'
        required: true

jobs:
  release:
    # Solo Windows: è l'unica piattaforma per cui il progetto distribuisce
    # installer. Per aggiungere macOS/Linux basta estendere questa matrice.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    permissions:
      # Necessario a tauri-action per creare la release e caricare gli artifact
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # Le novità vengono da NOTE_RILASCIO.md, scritto e committato prima del
      # tag. Vanno lette qui e non scritte dopo sulla pagina della release:
      # tauri-action copia il corpo della release in `notes` di latest.json al
      # momento della build, e ciò che si modifica dopo non arriva all'app.
      - name: Note di rilascio
        id: note
        shell: bash
        run: |
          # Il checkout su Windows porta i fine riga CRLF: i \r non devono
          # finire nelle note. $(...) toglie anche gli a capo finali, e printf
          # ne rimette uno solo, così il delimitatore resta su una riga sua.
          testo="$(tr -d '\r' < NOTE_RILASCIO.md 2>/dev/null)"
          if [ -z "${testo//[[:space:]]/}" ]; then
            echo "::error::NOTE_RILASCIO.md mancante o vuoto"
            exit 1
          fi
          # Delimitatore casuale: il testo delle note non può chiudere il blocco
          delimitatore="NOTE_$(openssl rand -hex 8)"
          {
            echo "testo<<$delimitatore"
            printf '%s\n' "$testo"
            echo "$delimitatore"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma degli aggiornamenti: senza queste variabili tauri-action
          # non genera latest.json né i file .sig
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          releaseName: 'MyMedicalFlow __VERSION__'
          # Il corpo della release finisce nel campo `notes` di latest.json e
          # viene mostrato nella finestra di aggiornamento dentro l'app, come
          # testo semplice: niente titoli markdown, che comparirebbero con i #.
          releaseBody: |
            ${{ steps.note.outputs.testo }}

            Aggiornamento automatico: se hai già MyMedicalFlow installato,
            l'app ti proporrà da sola questa versione al prossimo avvio.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
